
name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3

      - name: Download and prepare dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin

          # Native macOS yt-dlp executable
          curl -fL --retry 3 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos \
            -o bin/yt-dlp

          # Native Apple Silicon Deno executable
          curl -fL --retry 3 \
            https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip \
            -o /tmp/deno-macos.zip
          unzip -q /tmp/deno-macos.zip -d bin

          # FFmpeg and FFprobe
          brew install ffmpeg

          # Copy FFmpeg binaries and their non-system libraries
          python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          destination = Path("bin")
          pending = [
              Path(shutil.which("ffmpeg")),
              Path(shutil.which("ffprobe")),
          ]
          copied = set()

          while pending:
              source = pending.pop()
              resolved = source.resolve()
          
              if str(source) in copied:
                  continue
          
              copied.add(str(source))
          
              # Preserve the original library filename
              target = destination / source.name
              
              # Avoid copying the same library twice
              if not target.exists():
                  shutil.copy2(resolved, target)
                  target.chmod(target.stat().st_mode | 0o200)

              output = subprocess.check_output(
                  ["otool", "-L", str(source)], text=True
              )

              for line in output.splitlines()[1:]:
                  dependency = line.strip().split(" (", 1)[0]
                  if dependency.startswith((
                      "/opt/homebrew/",
                      "/usr/local/",
                  )):
                      pending.append(Path(dependency))

          # Make copied dylib references relative to executables
          for path in destination.iterdir():
              if path.name in ("yt-dlp", "deno"):
                  continue

              output = subprocess.check_output(
                  ["otool", "-L", str(path)], text=True
              )

              for line in output.splitlines()[1:]:
                  dependency = line.strip().split(" (", 1)[0]
                  if dependency.startswith((
                      "/opt/homebrew/",
                      "/usr/local/",
                  )):
                      subprocess.run([
                          "install_name_tool", "-change",
                          dependency,
                          "@loader_path/" + Path(dependency).name,
                          str(path)
                      ], check=True)

          PY

          chmod +x bin/yt-dlp bin/ffmpeg bin/ffprobe bin/deno

      - name: Verify dependencies
        run: |
          ./bin/yt-dlp --version
          ./bin/ffmpeg -version
          ./bin/ffprobe -version
          ./bin/deno --version
          file bin/yt-dlp bin/ffmpeg bin/ffprobe bin/deno

      - name: Build macOS application
        run: |
          pyinstaller --noconfirm --clean YT-DLP-Helper-macOS.spec

      - name: Verify bundled executables
        run: |
          APP="dist/YT-DLP Helper.app"
          test -d "$APP"

          RESOURCE_DIR="$APP/Contents/Frameworks/bin"
          if [ ! -d "$RESOURCE_DIR" ]; then
            RESOURCE_DIR="$APP/Contents/Resources/bin"
          fi

          for executable in yt-dlp ffmpeg ffprobe deno; do
            test -x "$RESOURCE_DIR/$executable"
          done

      - name: Test bundled macOS dependencies
        shell: bash
        run: |
          set -euo pipefail

          APP="dist/YT-DLP Helper.app"

          echo "Checking application executable..."
          ls -l "$APP/Contents/MacOS/"

          echo "Checking bundled dependencies..."
          find "$APP/Contents" -type f \
            \( -name "yt-dlp" -o -name "ffmpeg" \
            -o -name "ffprobe" -o -name "deno" \)

          echo "Checking FFmpeg shared libraries..."
          find "$APP/Contents" -name "*.dylib" | wc -l

          echo "Checking application metadata..."
          plutil -p "$APP/Contents/Info.plist"

          echo "Checking code signature (informational)..."
          codesign --verify --deep --verbose=2 "$APP" || true
          
          echo "Testing bundled executables..."

          RESOURCE_DIR="$APP/Contents/Frameworks/bin"
          if [ ! -d "$RESOURCE_DIR" ]; then
            RESOURCE_DIR="$APP/Contents/Resources/bin"
          fi

          "$RESOURCE_DIR/yt-dlp" --version
          "$RESOURCE_DIR/ffmpeg" -version
          "$RESOURCE_DIR/ffprobe" -version
          "$RESOURCE_DIR/deno" --version

      - name: Test FFmpeg portability
        shell: bash
        run: |
          set -euo pipefail

          APP="dist/YT-DLP Helper.app"
          BIN="$APP/Contents/Frameworks/bin"

          echo "Checking for external Homebrew dependencies..."

          python - "$BIN" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          bin_dir = Path(sys.argv[1])
          files = [
              bin_dir / "ffmpeg",
              bin_dir / "ffprobe",
              *bin_dir.glob("*.dylib"),
          ]

          # PyInstaller may place shared libraries in
          # Contents/Frameworks rather than Frameworks/bin.
          files += list(bin_dir.parent.glob("*.dylib"))

          failures = []

          for path in files:
              output = subprocess.check_output(
                  ["otool", "-L", str(path)],
                  text=True,
              )

              for line in output.splitlines()[1:]:
                  dep = line.strip().split(" (", 1)[0]

                  if dep.startswith(("/opt/homebrew/", "/usr/local/")):
                      failures.append(f"{path.name}: external {dep}")

                  elif dep.startswith("@loader_path/"):
                      relative = dep.removeprefix("@loader_path/")
                      expected = path.parent / relative
                      if not expected.exists():
                          failures.append(
                              f"{path.name}: missing {dep}"
                          )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print("PASS: No missing @loader_path libraries or "
                "absolute Homebrew dependencies found.")
          PY

      - name: Test bundled video and audio conversion
        shell: bash
        run: |
          set -euo pipefail

          APP="dist/YT-DLP Helper.app"
          BIN="$APP/Contents/Frameworks/bin"

          mkdir -p /tmp/ytdlp-test

          echo "Creating a short test video..."
          "$BIN/ffmpeg" -y \
            -f lavfi -i "testsrc2=duration=2:size=320x240:rate=24" \
            -f lavfi -i "sine=frequency=440:duration=2" \
            -c:v mpeg4 -c:a aac \
            -shortest /tmp/ytdlp-test/source.mp4

          echo "Converting video to MP4..."
          "$BIN/ffmpeg" -y \
            -i /tmp/ytdlp-test/source.mp4 \
            -c:v libx264 -c:a aac \
            /tmp/ytdlp-test/converted.mp4

          echo "Extracting MP3 audio..."
          "$BIN/ffmpeg" -y \
            -i /tmp/ytdlp-test/source.mp4 \
            -vn -c:a libmp3lame \
            /tmp/ytdlp-test/audio.mp3

          echo "Verifying output files..."
          test -s /tmp/ytdlp-test/converted.mp4
          test -s /tmp/ytdlp-test/audio.mp3

          "$BIN/ffprobe" -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            /tmp/ytdlp-test/converted.mp4

          "$BIN/ffprobe" -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            /tmp/ytdlp-test/audio.mp3

          echo "PASS: Video conversion and MP3 extraction succeeded."

      - name: Create DMG
        run: |
          mkdir -p dmg-content
          cp -R "dist/YT-DLP Helper.app" dmg-content/
          ln -s /Applications dmg-content/Applications

          hdiutil create \
            -volname "YT-DLP Helper" \
            -srcfolder dmg-content \
            -ov \
            -format UDZO \
            "YT-DLP-Helper-macOS-AppleSilicon.dmg"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YT-DLP-Helper-macOS-AppleSilicon
          path: YT-DLP-Helper-macOS-AppleSilicon.dmg
